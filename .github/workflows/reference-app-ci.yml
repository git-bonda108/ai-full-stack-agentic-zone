# Quality gates for the reference app on every PR and push: lint, tests + coverage, golden-set evals, security scans.
name: reference-app-ci
on:
  workflow_call:
  pull_request:
    paths: ["reference-app/**", ".github/workflows/reference-app-ci.yml"]
  push:
    branches: [main]
    paths: ["reference-app/**"]
permissions:
  contents: read
defaults:
  run:
    working-directory: reference-app
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "reference-app/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint & format
        run: ruff check . && ruff format --check .
      - name: Tests + coverage
        run: pytest -q --junitxml=docs/test-evidence/junit.xml --cov=backend/app --cov-report=term --cov-report=xml:docs/test-evidence/coverage.xml --cov-fail-under=85
      - name: Golden-set evals (regression gate, offline = free + deterministic)
        run: python -m evals.run_evals
        env: { LLM_PROVIDER: offline }
      - name: Security scans (report only)
        run: |
          bandit -q -r backend -ll || true
          pip-audit -r requirements.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-evidence, path: reference-app/docs/test-evidence/ }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: reference-app/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: reference-app/frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
