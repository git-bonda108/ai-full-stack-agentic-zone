# Publishes this training runbook (the static site at the repo root) to GitHub Pages.
name: training-site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "content/**"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.pages.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp -r index.html assets content staticwebapp.config.json _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: pages
        uses: actions/deploy-pages@v4
