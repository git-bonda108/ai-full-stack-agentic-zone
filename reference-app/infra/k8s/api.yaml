# Optional AKS path: the same API image on Kubernetes. Compare with ONE `az containerapp create`.
#   kubectl create secret generic p2p-secrets --from-literal=DATABASE_URL=... --from-literal=APPLICATIONINSIGHTS_CONNECTION_STRING=...
#   kubectl apply -f infra/k8s/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2p-api
  labels: { app: p2p-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: p2p-api }
  template:
    metadata:
      labels: { app: p2p-api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: api
          image: <acr-name>.azurecr.io/p2p-api:<tag>
          ports: [{ containerPort: 8000 }]
          env:
            - { name: ERP_BASE_URL, value: "http://p2p-erp:8001" }
            - { name: LLM_PROVIDER, value: "offline" }
          envFrom:
            - secretRef: { name: p2p-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-api
spec:
  type: LoadBalancer
  selector: { app: p2p-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: p2p-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: p2p-api }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
